name: Suite - Xtensa

on:
  workflow_call:
    inputs:
      trigger-sha:
        required: true
        type: string
      scope:
        description: 'Scope of tests to run (basic or all)'
        required: false
        type: string
        default: 'all'
    secrets:
      tflm-bot-token:
        required: true

permissions:
  contents: read

env:
  XTENSA_TOOLS_VERSION: RI-2022.9-linux

jobs:
  # --- Basic Jobs ---

  xtensa_bazel:
    if: inputs.scope == 'basic' || inputs.scope == 'all'
    runs-on: linux-x86-n4-16
    timeout-minutes: 30
    container:
      image: ghcr.io/tflm-bot/xtensa:0.2
      credentials:
        username: tflm-bot
        password: ${{ secrets.tflm-bot-token }}
    name: Xtensa Bazel (HiFi 5)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: false
          disk-cache: true
          cache-save: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          repository-cache: true
      - name: Xtensa Bazel Tests
        run: tensorflow/lite/micro/tools/ci_build/test_bazel_xtensa.sh hifi5

  # --- Extended Jobs ---

  vision_p6_tests:
    if: inputs.scope == 'all'
    runs-on: linux-x86-n4-16
    timeout-minutes: 60
    container:
      image: ghcr.io/tflm-bot/xtensa:0.2
      credentials:
        username: tflm-bot
        password: ${{ secrets.tflm-bot-token }}
    name: Vision P6 Tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - run: rm -rf .git
      - name: Vision P6 Tests
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          if [[ "${SCOPE}" == "all" ]]; then
            TEST_MODE="RUN_TESTS"
          else
            TEST_MODE="RUN_NO_TESTS"
          fi
          cd ..
          tflite-micro/tensorflow/lite/micro/tools/ci_build/test_xtensa_vision_p6.sh tflite-micro/ ${TEST_MODE}

  hifi5_unit_tests:
    if: inputs.scope == 'all'
    runs-on: linux-x86-n4-16
    timeout-minutes: 60
    container:
      image: ghcr.io/tflm-bot/xtensa:0.2
      credentials:
        username: tflm-bot
        password: ${{ secrets.tflm-bot-token }}
    name: Hifi5 Unit Tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - run: rm -rf .git
      - name: Hifi5 Unit Tests
        run: |
          cd ..
          tflite-micro/tensorflow/lite/micro/tools/ci_build/test_xtensa_hifi5.sh tflite-micro/

  hifi5_unit_tests_with_compression:
    if: inputs.scope == 'all'
    runs-on: linux-x86-n4-16
    timeout-minutes: 60
    container:
      image: ghcr.io/tflm-bot/xtensa:0.2
      credentials:
        username: tflm-bot
        password: ${{ secrets.tflm-bot-token }}
    name: Hifi5 Unit Tests with Compression
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - run: rm -rf .git
      - name: Hifi5 Unit Tests with Compression
        run: |
          cd ..
          tflite-micro/tensorflow/lite/micro/tools/ci_build/test_xtensa_hifi5_with_compression.sh tflite-micro/

  hifi_3z_unit_tests:
    if: inputs.scope == 'all'
    runs-on: linux-x86-n4-16
    timeout-minutes: 60
    container:
      image: ghcr.io/tflm-bot/xtensa:0.2
      credentials:
        username: tflm-bot
        password: ${{ secrets.tflm-bot-token }}
    name: Hifi3z Unit Tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - run: rm -rf .git
      - name: Hifi3z Unit Tests
        run: |
          cd ..
          tflite-micro/tensorflow/lite/micro/tools/ci_build/test_xtensa_hifi3z.sh tflite-micro/ EXTERNAL

  hifi_3z_unit_tests_with_compression:
    if: inputs.scope == 'all'
    runs-on: linux-x86-n4-16
    timeout-minutes: 60
    container:
      image: ghcr.io/tflm-bot/xtensa:0.2
      credentials:
        username: tflm-bot
        password: ${{ secrets.tflm-bot-token }}
    name: Hifi3z Unit Tests with Compression
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - run: rm -rf .git
      - name: Hifi3z Unit Tests with Compression
        run: |
          cd ..
          tflite-micro/tensorflow/lite/micro/tools/ci_build/test_xtensa_hifi3z_with_compression.sh tflite-micro/ EXTERNAL

  f1_unit_tests:
    if: inputs.scope == 'all'
    runs-on: linux-x86-n4-16
    timeout-minutes: 60
    container:
      image: ghcr.io/tflm-bot/xtensa:0.2
      credentials:
        username: tflm-bot
        password: ${{ secrets.tflm-bot-token }}
    name: Fusion F1 Unit Tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - run: rm -rf .git
      - name: Fusion F1 Unit Tests
        run: |
          cd ..
          tflite-micro/tensorflow/lite/micro/tools/ci_build/test_xtensa_fusion_f1.sh tflite-micro/ EXTERNAL
