name: Suite - Xtensa

on:
  workflow_call:
    inputs:
      trigger-sha:
        required: true
        type: string
      scope:
        description: 'Scope of tests to run (basic or all)'
        required: false
        type: string
        default: 'all'
    secrets:
      tflm-bot-token:
        required: true

permissions:
  contents: read

env:
  XTENSA_TOOLS_VERSION: RI-2022.9-linux

jobs:
  # --- Basic Jobs ---

  xtensa_bazel:
    if: inputs.scope == 'basic' || inputs.scope == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: hifi5
            name: HiFi 5
          - core: hifi3z
            name: HiFi 3z
          - core: fusion_f1
            name: Fusion F1
          - core: vision_p6
            name: Vision P6
    container:
      image: ghcr.io/tflm-bot/xtensa:0.2
      credentials:
        username: tflm-bot
        password: ${{ secrets.tflm-bot-token }}
      options: --init
    name: Xtensa Bazel (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: false
          disk-cache: true
          cache-save: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          repository-cache: true
      - name: Xtensa Bazel Tests
        run: tensorflow/lite/micro/tools/ci_build/test_bazel_xtensa.sh ${{ matrix.core }}

  # --- Extended Jobs ---

  vision_p6_tests:
    if: inputs.scope == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/tflm-bot/xtensa:0.2
      credentials:
        username: tflm-bot
        password: ${{ secrets.tflm-bot-token }}
      options: --init
    name: Vision P6 Tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - run: rm -rf .git
      - name: Vision P6 Tests
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          if [[ "${SCOPE}" == "all" ]]; then
            TEST_MODE="RUN_TESTS"
          else
            TEST_MODE="RUN_NO_TESTS"
          fi
          cd ..
          tflite-micro/tensorflow/lite/micro/tools/ci_build/test_xtensa_vision_p6.sh tflite-micro/ ${TEST_MODE}

  hifi5_unit_tests:
    if: inputs.scope == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/tflm-bot/xtensa:0.2
      credentials:
        username: tflm-bot
        password: ${{ secrets.tflm-bot-token }}
      options: --init
    name: Hifi5 Unit Tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - run: rm -rf .git
      - name: Hifi5 Unit Tests
        run: |
          cd ..
          tflite-micro/tensorflow/lite/micro/tools/ci_build/test_xtensa_hifi5.sh tflite-micro/

  hifi_3z_unit_tests:
    if: inputs.scope == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/tflm-bot/xtensa:0.2
      credentials:
        username: tflm-bot
        password: ${{ secrets.tflm-bot-token }}
      options: --init
    name: Hifi3z Unit Tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - run: rm -rf .git
      - name: Hifi3z Unit Tests
        run: |
          cd ..
          tflite-micro/tensorflow/lite/micro/tools/ci_build/test_xtensa_hifi3z.sh tflite-micro/ EXTERNAL

  f1_unit_tests:
    if: inputs.scope == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/tflm-bot/xtensa:0.2
      credentials:
        username: tflm-bot
        password: ${{ secrets.tflm-bot-token }}
      options: --init
    name: Fusion F1 Unit Tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - run: rm -rf .git
      - name: Fusion F1 Unit Tests
        run: |
          cd ..
          tflite-micro/tensorflow/lite/micro/tools/ci_build/test_xtensa_fusion_f1.sh tflite-micro/ EXTERNAL
