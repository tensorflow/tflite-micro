# https://help.github.com/en/actions/automating-your-workflow-with-github-actions/workflow-syntax-for-github-actions
#
# Helpful YAML parser to clarify YAML syntax:
# https://yaml-online-parser.appspot.com/
#

name: PyPI

on:
  schedule:
    # 1pm UTC is 6am or 7am PT depending on daylight savings.
    - cron: '0 13 * * *'

  workflow_dispatch:
    inputs:
      upload-type:
        description: 'Upload type'
        required: true
        default: 'pypi'
        type: choice
        options:
          - 'pypi'
          - 'no upload'
env:
  TWINE_PASSWORD: ${{ secrets.PYPI_API_KEY }}

permissions:
  contents: read

jobs:
  pypi-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.TFLM_BOT_REPO_TOKEN }}
      - name: Build Universal Python Wheel
        run: |
          python/tflite_micro/pypi_build.sh
      - name: Check Directory Output
        run: |
          ls -l bazel-pypi-out
      - name: Install Twine
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install twine
      - name: upload to pypi
        if: ${{ github.event.inputs.upload-type == 'pypi' || github.event_name == 'schedule' }}
        run: |
          twine upload --username __token__ --non-interactive bazel-pypi-out/*.whl
