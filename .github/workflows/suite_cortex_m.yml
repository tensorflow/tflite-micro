name: Suite - Cortex-M

on:
  workflow_call:
    inputs:
      trigger-sha:
        required: true
        type: string
      scope:
        description: 'Scope of tests to run (basic or all)'
        required: false
        type: string
        default: 'all'

jobs:
  # --- Basic Tests ---

  cortex_m_qemu:
    if: inputs.scope == 'basic' || inputs.scope == 'all'
    runs-on: linux-x86-n4-16
    timeout-minutes: 60
    container:
      image: ghcr.io/tflm-bot/corstone300:0.2
    name: Cortex-M QEMU Unit Tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - name: Test
        run: tensorflow/lite/micro/tools/ci_build/test_cortex_m_qemu.sh

  cortex_m_project_generation:
    if: inputs.scope == 'basic' || inputs.scope == 'all'
    runs-on: linux-x86-n4-16
    timeout-minutes: 60
    container:
      image: ghcr.io/tflm-bot/corstone300:0.2
    name: Cortex-M Project Generation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - name: Test
        run: |
          cd ..
          tflite-micro/tensorflow/lite/micro/tools/ci_build/test_cortex_m_project_generation.sh tflite-micro/

  cortex_m_bazel:
    if: inputs.scope == 'basic' || inputs.scope == 'all'
    runs-on: linux-x86-n4-16
    timeout-minutes: 60
    container:
      image: ghcr.io/tflm-bot/corstone300:0.2
    name: Cortex-M Bazel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: false
          disk-cache: true
          cache-save: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          repository-cache: true
      - name: Test
        run: tensorflow/lite/micro/tools/ci_build/test_bazel_cortex_m.sh

  corstone_300_bazel:
    if: inputs.scope == 'basic' || inputs.scope == 'all'
    runs-on: linux-x86-n4-16
    container:
      image: ghcr.io/tflm-bot/corstone300:0.2
    timeout-minutes: 60
    name: Cortex-M Corstone 300 Bazel (FVP + Ethos-U)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: false
          disk-cache: true
          cache-save: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          repository-cache: true
      - name: Test
        run: tensorflow/lite/micro/tools/ci_build/test_bazel_corstone300.sh

  # --- Extended Tests (Corstone 300) ---

  corstone_300_gcc:
    if: inputs.scope == 'all'
    runs-on: linux-x86-n4-16
    container:
      image: ghcr.io/tflm-bot/corstone300:0.2
    timeout-minutes: 60
    name: Cortex-M Corstone 300 (GCC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - name: Test
        run: tensorflow/lite/micro/tools/ci_build/test_cortex_m_corstone_300.sh
