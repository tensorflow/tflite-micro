name: Suite - Cortex-M

on:
  workflow_call:
    inputs:
      trigger-sha:
        required: true
        type: string
      scope:
        description: 'Scope of tests to run (basic or all)'
        required: false
        type: string
        default: 'all'
    secrets:
      tflm-bot-token:
        required: true

jobs:
  # --- Basic Tests (Bluepill, QEMU) ---

  cortex_m_bluepill:
    if: inputs.scope == 'basic' || inputs.scope == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: Cortex-M Bluepill
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - name: Install dependencies
        run: |
          pip3 install Pillow
          pip3 install numpy
      - name: Test
        run: |
          cd ../
          tflite-micro/tensorflow/lite/micro/tools/ci_build/test_bluepill.sh tflite-micro/

  cortex_m_qemu:
    if: inputs.scope == 'basic' || inputs.scope == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    name: Cortex-M QEMU Unit Tests
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - name: Test
        uses: docker://ghcr.io/tflm-bot/tflm-ci:0.6.10
        with:
          args: /bin/sh -c tensorflow/lite/micro/tools/ci_build/test_cortex_m_qemu.sh tflite-micro/

  # --- Extended Tests (Corstone 300) ---

  corstone_300_gcc:
    if: inputs.scope == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: Cortex-M Corstone 300 (GCC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - name: Test
        uses: docker://ghcr.io/tflm-bot/corstone300:0.1
        with:
          args: /bin/sh -c tensorflow/lite/micro/tools/ci_build/test_cortex_m_corstone_300.sh

  corstone_300_armclang:
    if: inputs.scope == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: Cortex-M Corstone 300 (Arm Clang)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip3 install Pillow
          pip3 install numpy
      - name: Install Arm tools
        uses: ARM-software/cmsis-actions/vcpkg@8a50b77681a484568e08f31fb7c2285c4735f682 # v1
        with:
          config: "tensorflow/lite/micro/tools/github/arm/vcpkg-configuration.json"
      - name: Activate Arm tool license
        uses: ARM-software/cmsis-actions/armlm@8a50b77681a484568e08f31fb7c2285c4735f682 # v1
      - name: Print License Logs on Failure
        if: failure()
        run: cat /home/runner/.armlm/logs/*.log
      - name: Test
        run: |
          tensorflow/lite/micro/tools/ci_build/test_cortex_m_corstone_300.sh armclang
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: my-artifact
          path: |
            tensorflow/
            gen/
