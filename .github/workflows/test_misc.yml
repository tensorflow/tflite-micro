name: Test - Misc (Style, Project Gen)

on:
  workflow_call:
    inputs:
      trigger-sha:
        required: true
        type: string

jobs:
  check_code_style:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    name: Code Style
    container:
      image: ghcr.io/tflm-bot/tflm-ci:0.6.10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - name: Check
        run: tensorflow/lite/micro/tools/ci_build/test_code_style.sh

  makefile_checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    name: Makefile Checks
    container:
      image: ghcr.io/tflm-bot/tflm-ci:0.6.10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - name: Check
        run: tensorflow/lite/micro/tools/ci_build/test_makefile.sh

  cpp_build_warnings:
    runs-on: linux-x86-n2-16
    timeout-minutes: 60
    container:
      image: ghcr.io/tflm-bot/tflm-ci:0.6.10
    name: C++ Build Warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.trigger-sha || github.ref }}
          allow-unsafe-pr-checkout: true
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          cache-save: ${{ github.event_name == 'push' }}
          repository-cache: true
      - name: Build with Warnings as Errors
        run: bazel build --compilation_mode=opt --copt="-Werror" --copt="-Wall" --copt="-Wextra" --copt="-Wno-unused-parameter" //...

  project_generation:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    name: Project Generation
    container:
      image: ghcr.io/tflm-bot/tflm-ci:0.6.10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          cache-save: ${{ github.event_name == 'push' }}
          repository-cache: true
      - name: Test
        run: |
          cd ..
          tflite-micro/tensorflow/lite/micro/tools/ci_build/test_project_generation.sh tflite-micro/

  clang_tidy:
    runs-on: linux-x86-n2-16
    timeout-minutes: 60
    container:
      image: ghcr.io/tflm-bot/tflm-ci:0.6.10
    name: Clang Tidy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
          fetch-depth: 0
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          cache-save: ${{ github.event_name == 'push' }}
          repository-cache: true
      - name: Generate Compilation Database
        run: python3 tensorflow/lite/micro/tools/ci_build/generate_compile_commands.py
      - name: Clang-Tidy Differential Check
        run: tensorflow/lite/micro/tools/ci_build/test_clang_tidy.sh
