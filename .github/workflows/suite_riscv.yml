name: Suite - RISC-V

on:
  workflow_call:
    inputs:
      trigger-sha:
        required: true
        type: string
    secrets:
      tflm-bot-token:
        required: true

jobs:
  riscv_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: RISC-V Tests
    steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.trigger-sha }}
        allow-unsafe-pr-checkout: true
    - name: Test
      uses: docker://ghcr.io/tflm-bot/tflm-ci:0.6.10
      with:
        args: /bin/sh -c tensorflow/lite/micro/tools/ci_build/test_riscv.sh

  riscv_bazel:
    runs-on: linux-x86-n4-16
    timeout-minutes: 60
    container:
      image: ghcr.io/tflm-bot/tflm-ci:0.6.10
    name: RISC-V Bazel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          cache-save: ${{ github.event_name == 'push' }}
          repository-cache: true
      - name: Test
        run: tensorflow/lite/micro/tools/ci_build/test_bazel_riscv.sh
