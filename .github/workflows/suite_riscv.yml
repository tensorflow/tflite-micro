name: Suite - RISC-V

on:
  workflow_call:
    inputs:
      trigger-sha:
        required: true
        type: string
      scope:
        description: 'Scope of tests to run (basic or all)'
        required: false
        type: string
        default: 'all'
    secrets:
      tflm-bot-token:
        required: true

jobs:
  riscv_bazel:
    if: inputs.scope == 'basic' || inputs.scope == 'all'
    runs-on: linux-x86-n4-16
    timeout-minutes: 60
    container:
      image: ghcr.io/tflm-bot/tflm-ci:0.6.10
    name: RISC-V Bazel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.trigger-sha }}
          allow-unsafe-pr-checkout: true
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          cache-save: ${{ github.event_name == 'push' }}
          repository-cache: true
      - name: Test
        run: tensorflow/lite/micro/tools/ci_build/test_bazel_riscv.sh
